[package]
name = "mizuyokan-engine"
version = "0.1.0"
edition = "2021"
description = "Stateless JP/EN live conversion for Mizuyokan (azooKey-Windows integration)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
once_cell = "1.20"

[dev-dependencies]
pretty_assertions = "1.4"
